<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrical Asset Dashboard | PEA</title>
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS CDN for Excel Upload -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard-container">
        <header class="animate-fade-in">
            <div>
                <h1>Asset Management Dashboard</h1>
                <p style="color: var(--text-secondary); margin-top: 0.5rem;">Tracking & Inspection Overview</p>
            </div>
        </header>

        <!-- KPI Section -->
        <section class="kpi-grid">
            <div class="glass-card kpi-card animate-fade-in" style="animation-delay: 0.1s">
                <span class="kpi-label">Total Materials</span>
                <span class="kpi-value" id="kpi-total-materials">0</span>
            </div>
            <div class="glass-card kpi-card animate-fade-in" style="animation-delay: 0.2s">
                <span class="kpi-label">Total Batches</span>
                <span class="kpi-value" id="kpi-total-batches">0</span>
            </div>
            <div class="glass-card kpi-card animate-fade-in" style="animation-delay: 0.3s">
                <span class="kpi-label">Active Inspectors</span>
                <span class="kpi-value" id="kpi-total-inspectors">0</span>
            </div>
        </section>

        <!-- Visualizations -->
        <section class="viz-grid">
            <div class="glass-card animate-fade-in" style="animation-delay: 0.4s">
                <h3 style="margin-bottom: 1.5rem;">Material Distribution</h3>
                <div class="chart-container">
                    <canvas id="materialChart"></canvas>
                </div>
            </div>
            <div class="glass-card animate-fade-in" style="animation-delay: 0.5s">
                <h3 style="margin-bottom: 1.5rem;">Warehouse Overview</h3>
                <div class="chart-container">
                    <canvas id="warehouseChart"></canvas>
                </div>
            </div>
        </section>

        <!-- Filters -->
        <section class="glass-card animate-fade-in" style="animation-delay: 0.6s; margin-bottom: 2rem;">
            <div class="filter-bar">
                <div class="input-group">
                    <label>Inspector ID</label>
                    <select id="filter-inspector">
                        <option value="">All Inspectors</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Material Type</label>
                    <select id="filter-type">
                        <option value="">All Types</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>PEA No.</label>
                    <input type="text" id="filter-pea" placeholder="Ex: PEA-99...">
                </div>
                <div class="input-group">
                    <label>Search Serial No.</label>
                    <input type="text" id="filter-serial" placeholder="Ex: SN-1001">
                </div>
                <button class="upload-btn" style="background: rgba(255,255,255,0.1); border: 1px solid var(--glass-border);" id="reset-filters">
                    Reset
                </button>
            </div>
        </section>

        <!-- Detailed Table -->
        <section class="glass-card animate-fade-in" style="animation-delay: 0.7s">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                <h3>Inspection Tracking Details</h3>
                <span id="data-count" style="font-size: 0.875rem; color: var(--text-secondary);">Showing 0 entries</span>
            </div>
            <div class="table-container">
                <table id="asset-table">
                    <thead>
                        <tr>
                            <th onclick="sortTable('InspectorID')">Inspector ID</th>
                            <th onclick="sortTable('WarehouseCode')">Warehouse</th>
                            <th onclick="sortTable('MaterialType')">Type</th>
                            <th onclick="sortTable('Batch')">Batch</th>
                            <th onclick="sortTable('SerialNo')">Serial No.</th>
                            <th onclick="sortTable('NEW PEA No.')">NEW PEA No.</th>
                            <th onclick="sortTable('ADS')">ADS ↕</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <!-- Data rows will be injected here -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
